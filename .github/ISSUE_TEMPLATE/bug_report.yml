name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, list the steps to make it happen again.
  - type: input
    id: timecount
    attributes:
      label: TimeCount version
      description: Shown on the extension's page in the Extensions view.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version
      description: Help, then About.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or your TimeCount settings can help. Please do not paste your data files unless you are happy to share them.
